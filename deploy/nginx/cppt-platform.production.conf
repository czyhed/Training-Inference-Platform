# Owned by cppt-platform. Installed only for this application's gateway.
map $http_upgrade $cppt_platform_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 13101;
    server_name _;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:13100;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cppt_platform_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
}
